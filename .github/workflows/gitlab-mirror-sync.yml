# Workflow untuk sinkronisasi otomatis SATU ARAH:
# GitHub (sumber) -> GitLab (cermin/mirror)
name: Sync to GitLab Mirror

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  mirror-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode LENGKAP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      # Install git-filter-repo, tool untuk hapus file
      # dari SELURUH history secara permanen
      - name: Install git-filter-repo
        run: pip install git-filter-repo

      # Hapus video-dummy.mp4 dari SELURUH commit history,
      # KHUSUS di salinan runner ini (repo asli di GitHub
      # TIDAK tersentuh sama sekali, karena ini cuma
      # salinan sementara di dalam runner Actions)
      - name: Hapus file LFS bermasalah dari history
        run: |
          git filter-repo --invert-paths --path video-dummy.mp4 --force

      - name: Push mirror ke GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/fajriluckyboy/github-latihan-gitlab-mirror.git
          git push gitlab --all --force
          git push gitlab --tags --force
