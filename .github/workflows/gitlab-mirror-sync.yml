# Workflow untuk sinkronisasi otomatis SATU ARAH:
# GitHub (sumber) -> GitLab (cermin/mirror)
name: Sync to GitLab Mirror

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  mirror-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode LENGKAP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      # Copot hook LFS sepenuhnya dari repo lokal ini,
      # supaya git push TIDAK memicu proses upload LFS
      # sama sekali - video-dummy.mp4 akan terkirim
      # sebagai pointer teks biasa, bukan file LFS
      - name: Uninstall LFS hooks
        run: git lfs uninstall --local

      - name: Push mirror ke GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/fajriluckyboy/github-latihan-gitlab-mirror.git
          git push gitlab --all --force
          git push gitlab --tags --force
