# Workflow untuk deteksi typo otomatis di file dokumentasi
# menggunakan tool misspell yang dibungkus oleh reviewdog
name: Spell Check Markdown

# Jalankan setiap ada pull_request yang menyentuh file .md
# supaya typo tertangkap SEBELUM masuk ke branch utama
on:
  pull_request:
    paths:
      - "**/*.md"

# Batasi permission token GitHub Actions ke minimal yang
# dibutuhkan saja — sesuai prinsip keamanan yang sudah
# kita terapkan sejak Level 4
permissions:
  contents: read
  pull-requests: write # dibutuhkan reviewdog untuk komentar di PR

jobs:
  misspell:
    runs-on: ubuntu-latest
    steps:
      # Ambil kode dari repo terlebih dahulu
      - name: Checkout kode
        uses: actions/checkout@v7

      # Jalankan reviewdog dengan tool misspell
      # reviewdog akan otomatis komentar di baris yang typo
      - name: Cek typo dengan misspell
        uses: reviewdog/action-misspell@v1
        with:
          # token bawaan GitHub Actions untuk autentikasi
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # reporter: cara reviewdog laporkan hasil
          # "github-pr-review" = komentar langsung di baris PR
          reporter: github-pr-review
          # level: seberapa serius kalau ada typo ditemukan
          # "warning" = tandai tapi tidak gagalkan workflow
          level: warning
          # locale: fokus ke typo bahasa Inggris US
          locale: "US"
