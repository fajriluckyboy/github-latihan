# Workflow untuk generate RSS feed otomatis dari release
# dan issue terbaru, lalu buka Pull Request otomatis
# (BUKAN commit langsung ke master, supaya tetap patuh
# branch protection: wajib PR + wajib signed commit)
name: Generate RSS Feed

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate feed.xml
        run: node .github/scripts/generate-rss.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ganti dari commit+push manual menjadi PEMBUATAN PR
      # otomatis. Action ini akan:
      # 1. cek apakah ada perubahan di working directory
      # 2. kalau ADA, buat branch baru otomatis
      # 3. commit perubahan ke branch itu
      # 4. push branch tersebut
      # 5. buka Pull Request ke master
      # Kalau TIDAK ADA perubahan, action ini otomatis
      # skip tanpa melakukan apapun (tidak perlu kita
      # cek manual seperti sebelumnya)
      - name: Buat Pull Request untuk update feed.xml
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # commit-message: pesan commit di dalam PR
          commit-message: "chore: update RSS feed otomatis"
          # branch: nama branch baru yang akan dibuat
          branch: auto/update-rss-feed
          # title dan body: judul dan deskripsi PR
          title: "chore: update RSS feed otomatis"
          body: |
            PR ini dibuat otomatis oleh workflow `rss-feed.yml`
            untuk memperbarui `docs/feed.xml` berdasarkan
            release dan issue terbaru di repo ini.

            Silakan review isi feed.xml sebelum approve dan merge.
          # delete-branch: hapus branch otomatis setelah PR di-merge
          delete-branch: true
