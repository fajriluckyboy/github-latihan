# Workflow untuk generate RSS feed otomatis dari release
# dan issue terbaru, lalu commit hasilnya balik ke repo
name: Generate RSS Feed

on:
  # Jalan terjadwal setiap hari jam 04:00 UTC
  schedule:
    - cron: "0 4 * * *"
  # Bisa dipicu manual untuk testing
  workflow_dispatch:
  # Jalan otomatis setiap ada release baru dipublish
  release:
    types: [published]

# Permission write dibutuhkan karena workflow ini
# akan COMMIT perubahan balik ke repo
permissions:
  contents: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # Jalankan script yang sudah kita buat dan uji coba
      # secara lokal — logic-nya SAMA PERSIS
      - name: Generate feed.xml
        run: node .github/scripts/generate-rss.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Setup identitas git untuk commit otomatis
      # memakai identitas github-actions bot bawaan
      - name: Setup git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Cek dulu apakah ADA perubahan di feed.xml
      # supaya tidak bikin commit KOSONG kalau isinya
      # sama persis dengan sebelumnya
      - name: Commit dan push jika ada perubahan
        run: |
          if git diff --quiet docs/feed.xml; then
            echo "Tidak ada perubahan pada feed.xml, skip commit."
          else
            git add docs/feed.xml
            git commit -m "chore: update RSS feed otomatis"
            git push
          fi
